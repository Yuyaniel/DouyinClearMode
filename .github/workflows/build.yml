name: Build LSPosed Module

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 固定 Gradle 8.13，与 AGP 8.13.2 匹配。
          # 不显式指定时 runner 默认可能用 Gradle 9.x，AGP 8.x 不兼容。
          gradle-version: "8.13"

      # GitHub ubuntu-latest runner 已预装 Android SDK + cmdline-tools（含 sdkmanager），
      # 但 cmdline-tools/latest/bin 不在默认 PATH 中，需手动定位；
      # 不再用 android-actions/setup-android（会去装已废弃的 'tools' 包而报错）。
      # 注意：API 37 为新的 minor 版本机制，平台包名为 platforms;android-37.0，
      # 不存在裸名 platforms;android-37。
      - name: Install SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: douyin-clear-mode
          path: app/build/outputs/apk/release/*.apk
