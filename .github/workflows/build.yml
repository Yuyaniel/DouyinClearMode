name: Build LSPosed Module

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 固定 Gradle 8.13，与 AGP 8.13.2 匹配。
          # 不显式指定时 runner 默认可能用 Gradle 9.x，AGP 8.x 不兼容。
          gradle-version: "8.13"

      # GitHub 的 ubuntu-latest runner 已预装 Android SDK + cmdline-tools（含 sdkmanager），
      # 无需 android-actions/setup-android（它会去装已废弃的 'tools' 包而报错）。
      - name: Install SDK platform 37
        run: |
          set +e
          SDKMANAGER="$(dirname "$(dirname "$(which sdkmanager)")")/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(which sdkmanager)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: douyin-clear-mode
          path: app/build/outputs/apk/release/*.apk
